# Server-side Fiducia telemetry policy.
# Runtime credentials/endpoints are supplied through the referenced environment variable.
version = 1

[server]
enabled = true
service_name = "fiducia-telemetry"

[server.logging]
enabled = true
level = "info"
console = true
auto_send = false

[server.tracing]
enabled = true
sample_ratio = 1.0
propagators = ["tracecontext", "baggage"]

[server.metrics]
enabled = true

[server.exporter]
protocol = "otlp_grpc"
endpoint_env = "FIDUCIA_OTEL_ENDPOINT"
